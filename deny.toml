# cargo-deny configuration
# <https://embarkstudios.github.io/cargo-deny/>

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "GPL-2.0-only",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "OpenSSL",
]
confidence-threshold = 0.8
exceptions = [
    # kprobe-harness is GPL-2.0 compatible by design (kernel module linkage).
    { allow = ["GPL-2.0-only"], name = "tpt-l-kprobe-harness" },
]
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
