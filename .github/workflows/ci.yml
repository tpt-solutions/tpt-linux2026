name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Format / Clippy / Audit / Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo-deny (licenses + advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: "--all-features"

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  test:
    name: Unit & Integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        # Kernel-dependent integration tests `#[ignore]` unless RUN_QEMU=1.
        run: cargo test --workspace --all-targets

  kernel-matrix:
    name: Kernel ${{ matrix.kernel }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - "6.6"
          - "6.12"
          - "stable"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache QEMU kernel image
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.qemu-kernels/${{ matrix.kernel }}
          key: qemu-kernel-${{ matrix.kernel }}-v1

      - name: Build QEMU kernel image
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: ./.github/scripts/build-qemu-kernel.sh "${{ matrix.kernel }}"

      - name: Run integration tests under QEMU
        run: ./.github/scripts/run-qemu-tests.sh "${{ matrix.kernel }}"
